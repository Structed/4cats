name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    name: Prüfen und bauen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Godot und Export-Vorlagen zwischenspeichern
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot installieren
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

          curl -fsSL -o /tmp/templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Godot zum Pfad hinzufügen
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Ressourcen importieren
        run: godot --headless --path . --import

      - name: Projektkonfiguration prüfen
        run: godot --headless --path . --script res://tools/check_project.gd

      - name: Spiellogik testen
        run: godot --headless --path . -- --test

      - name: Windows-Fassung bauen
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/4cats.exe

      - name: Windows-Fassung als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: 4cats-windows
          path: build/windows/
          if-no-files-found: error
