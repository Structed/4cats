name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    name: Prüfen und bauen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Godot einrichten
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Ressourcen importieren
        run: godot --headless --path . --import

      - name: Skripte uebersetzen
        run: pwsh tools/lint_scripts.ps1

      - name: Projektkonfiguration prüfen
        run: godot --headless --path . --script res://tools/check_project.gd

      - name: Spiellogik testen
        run: godot --headless --path . -- --test

      - name: Spieltest (Katze wirklich einfangen)
        run: godot --headless --path . -- --playtest

      - name: Durchlauf durch alle Szenen
        run: godot --headless --path . -- --smoketest

      - name: Windows-Fassung bauen
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/4cats.exe

      - name: Windows-Fassung als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: 4cats-windows
          path: build/windows/
          if-no-files-found: error
